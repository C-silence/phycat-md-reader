plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mddroid'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.mddroid'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 预览版用 debug 签名，方便直接安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
