<!-- ===== 查看器 override：任务清单复选框 =====

<style id="taskOverride">
  #write li.task-list-item { position: relative; list-style: none; }
  #write li.task-list-item > input[type="checkbox"].task-check {

    background: transparent;
    cursor: pointer; outline: none;
  }

  }
  #write li.task-list-item > input[type="checkbox"].task-check::before { content: none; }
  #write li.task-list-item > input[type="checkbox"].task-check::after {
    content: '';
    position: absolute;
    left: .4em; top: .14em;
    width: .3em; height: .55em;
    border: solid #fff;
    border-width: 0 .15em .15em 0;
    transform: rotate(45deg);

    background: var(--element-color, #e0a04a);
    border-color: var(--element-color, #e0a04a);
  }
  #write li.task-list-item > input[type="checkbox"].task-check:checked::after { opacity: 1; }

<script>
(function () {
  'use strict';

  /* ---------- 渲染引擎与主题 ---------- */
  var md = window.markdownit({ html: true, linkify: true, breaks: false });
  var writeEl = document.getElementById('write');
  var contentEl = document.getElementById('content');

  var THEMES = [
    { file: '../phycat-caramel.css',  name: 'Caramel 焦糖橙',   outer: '#f1ece4', dark: false },
    { file: '../phycat-cherry.css',   name: 'Cherry 樱桃红',   outer: '#f3ebec', dark: false },
    { file: '../phycat-forest.css',   name: 'Forest 森林绿',   outer: '#eaf0e6', dark: false },
    { file: '../phycat-mauve.css',    name: 'Mauve 暮光紫',    outer: '#efeaf1', dark: false },
    { file: '../phycat-mint.css',     name: 'Mint 薄荷青',     outer: '#e6f0ec', dark: false },
    { file: '../phycat-prussian.css', name: 'Prussian 普鲁士蓝', outer: '#e7edf2', dark: false },
    { file: '../phycat-sakura.css',   name: 'Sakura 樱花粉',   outer: '#f5ecef', dark: false },
    { file: '../phycat-sky.css',      name: 'Sky 晴空蓝',      outer: '#e8f0f5', dark: false },
    { file: '../phycat-dark.css',     name: 'Dark 夜间',       outer: '#202124', dark: true  }
  ];

  var el = {};
  ['themeSel','prevBtn','nextBtn','sideToggle','pickBtn','sampleBtn','state',
   'sideTabs','folderBtn','lib','libWrap','libCount','emptyLib',
   'outlineList','outlineWrap','emptyOutline','footName']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  /* ---------- 文档库（内存版书架） ---------- */
  var docs = {};          // key -> { key, name, path, text, builtin }
  var order = [];         // 显示顺序：内置示例在前
  var activeKey = null;
  var taskChecks = {};       // docKey -> 该文档每个任务项的最终勾选布尔值（本次运行内记住）
  var builtinSample = {
    key: 'builtin:sample', name: '示例 sample.md', path: '内置示例',
    text: document.getElementById('sampleMd').textContent.replace(/^\s+/, '').replace(/\s+$/, ''),
    builtin: true
  };

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function isMd(name) { return /\.(md|markdown)$/i.test(name); }

  /* ---------- Markdown → Typora HTML（fidelity shim） ---------- */
  function render(text) {
    var html = '';
    var m = /^---\n([\s\S]*?)\n---\n?/.exec(text);
    if (m) { html += '<pre class="md-meta-block">' + esc(m[1]) + '</pre>'; text = text.slice(m[0].length); }
    return html + md.render(text);
  }
  /* ---------- 任务清单 ----------
     markdown-it 的 `- [ ] xxx` 就是普通列表项，这里把它转成
       <li class="task-list-item"><input type="checkbox" class="task-check">…</li>
     并把剩余正文包进 <span class="task-content">（划线样式的作用点），
     checkbox 可点击；勾选状态按文档记在 taskChecks，本次运行内重开同一文档仍保留。 */
  function fixTasks(root) {
    var lis = root.querySelectorAll('li');
    var stored = taskChecks[activeKey] || null;
    var idx = 0;
    for (var i = 0; i < lis.length; i++) {
      var li = lis[i];
      // 正文宿主：宽松列表内容在 <p>/<span> 里，紧凑列表直接在 <li>
      var host = null;
      for (var c = 0; c < li.children.length; c++) {
        var tag = li.children[c].tagName;
        if (tag === 'P' || tag === 'SPAN') { host = li.children[c]; break; }
      }
      if (!host) host = li;
      var node = host.firstChild;
      if (!node || node.nodeType !== 3) continue;
      var m = /^\s*\[([ xX])\]\s+/.exec(node.nodeValue);
      if (!m) continue;
      node.nodeValue = node.nodeValue.replace(/^\s*\[([ xX])\]\s+/, '');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'task-check';
      cb.checked = (m[1].toLowerCase() === 'x');
      if (stored && idx < stored.length && typeof stored[idx] === 'boolean') {
        cb.checked = stored[idx];
      }
      li.classList.add('task-list-item');

      // 把该段正文收进 <span class="task-content">；遇到嵌套的 ul/ol/pre 等块级就停下，
      // 让它们作为 <span> 之后的兄弟节点保留（子列表不被包进 span）
      var wrap = document.createElement('span');
      wrap.className = 'task-content';
      var child;
      while ((child = host.firstChild)) {
        if (host === li && child.nodeType === 1
            && /^(UL|OL|PRE|BLOCKQUOTE|TABLE|HR|P)$/.test(child.tagName)) break;
        wrap.appendChild(child);
      }
      host.insertBefore(wrap, host.firstChild);
      li.insertBefore(cb, host === li ? wrap : host);

      (function (docKey, ci, box) {
        box.addEventListener('change', function () {
          var arr = taskChecks[docKey] = taskChecks[docKey] || [];
          arr[ci] = box.checked;
        });
      })(activeKey, idx, cb);
      idx++;
    }
  }
  function decorate(root) {
    var hs = root.querySelectorAll('h1,h2,h3,h4,h5,h6');
    for (var i = 0; i < hs.length; i++) hs[i].classList.add('md-heading');
    var pres = root.querySelectorAll('pre');
    for (var j = 0; j < pres.length; j++) pres[j].classList.add('md-fences');
    fixTasks(root);
  }

  /* ---------- 打开并渲染一份文档 ---------- */
  function openDoc(key) {
    var d = docs[key]; if (!d) return;
    activeKey = key;
    writeEl.innerHTML = render(d.text);
    decorate(writeEl);
    contentEl.scrollTop = 0;
    buildOutline();
    renderLib();
    updateState();
  }

  /* ---------- 大纲 ---------- */
  var headingEls = [];
  function buildOutline() {
    var ul = el.outlineList; ul.innerHTML = '';
    headingEls = Array.prototype.slice.call(writeEl.querySelectorAll('h1,h2,h3,h4,h5,h6'));
    var has = headingEls.length > 0;
    el.emptyOutline.hidden = has;
    el.outlineWrap.style.display = has ? 'block' : 'none';
    el.outlineList.hidden = !has;
    headingEls.forEach(function (h) {
      var level = parseInt(h.tagName.charAt(1), 10);
      var li = document.createElement('li');
      li.className = 'l' + level;
      li.textContent = h.textContent.trim() || '(空标题)';
      li.title = h.textContent.trim();
      li.addEventListener('click', function () {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      ul.appendChild(li);
    });
  }

  var scrollRaf = null;
  function onScroll() {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () {
      scrollRaf = null;
      var top = contentEl.scrollTop + 12;
      var idx = -1;
      for (var i = 0; i < headingEls.length; i++) {
        var y = headingEls[i].getBoundingClientRect().top - contentEl.getBoundingClientRect().top + contentEl.scrollTop;
        if (y <= top) idx = i; else break;
      }
      var lis = el.outlineList.children;
      for (var k = 0; k < lis.length; k++) lis[k].classList.toggle('act', k === idx);
    });
  }
  contentEl.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- 文件库 UI ---------- */
  function registerDoc(doc, prepend) {
    if (docs[doc.key]) { docs[doc.key].text = doc.text; return; }
    docs[doc.key] = doc;
    if (prepend) order.unshift(doc.key); else order.push(doc.key);
  }
  function renderLib() {
    el.lib.innerHTML = '';
    var empty = Object.keys(docs).length === 0;
    el.emptyLib.hidden = !empty;
    el.lib.hidden = empty;
    el.libCount.textContent = Object.keys(docs).length + ' 篇';
    if (empty) return;
    var groupBy = {};
    order.forEach(function (k) {
      var d = docs[k];
      var g = d.path || '文档';
      (groupBy[g] = groupBy[g] || []).push(d);
    });
    Object.keys(groupBy).sort().forEach(function (g) {
      var li = document.createElement('li');
      var dt = document.createElement('details');
      dt.open = true;
      var sm = document.createElement('summary');
      sm.textContent = g;
      dt.appendChild(sm);
      var inner = document.createElement('ul');
      groupBy[g].forEach(function (d) {
        var it = document.createElement('li');
        var f = document.createElement('div');
        f.className = 'fname'; f.dataset.key = d.key;
        f.innerHTML = '<span class="ico">📄</span><span></span>';
        f.querySelector('span:last-child').textContent = d.name;
        f.addEventListener('click', function () { openDoc(d.key); });
        it.appendChild(f);
        inner.appendChild(it);
      });
      dt.appendChild(inner);
      li.appendChild(dt);
      el.lib.appendChild(li);
    });
    // 高亮当前文档
    el.lib.querySelectorAll('.fname').forEach(function (n) {
      n.classList.toggle('active', n.dataset.key === activeKey);
    });
  }

  /* ---------- 侧栏 Tab ---------- */
  function setTab(pane) {
    el.sideTabs.querySelectorAll('.tab').forEach(function (b) {
      var on = b.dataset.pane === pane;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    ['files', 'outline'].forEach(function (p) {
      document.getElementById('pane-' + p).hidden = (p !== pane);
    });
    try { localStorage.setItem('sideTab', pane); } catch (e) {}
  }
  el.sideTabs.addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (b) setTab(b.dataset.pane);
  });

  /* ---------- 主题 ---------- */
  function currentIndex() { return parseInt(el.themeSel.value, 10) || 0; }

  /* hex → [r,g,b]，支持 #rgb 与 #rrggbb */
  function hexToRgb(hex) {
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    var s = m[1];
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  }

  /* 让侧栏强调色跟随当前主题：读取主题在 :root 定义的主色并换算成高亮底色 */
  function applyAccent() {
    var cs = getComputedStyle(document.documentElement);
    var acc = cs.getPropertyValue('--element-color').trim()
           || cs.getPropertyValue('--head-title-color').trim()
           || '';
    var t = THEMES[currentIndex()];
    if (!acc) acc = t.dark ? '#e2945c' : '#bf6a2f';
    var rgb = hexToRgb(acc) || [191, 106, 47];
    var root = document.documentElement.style;
    root.setProperty('--side-acc', acc);
    root.setProperty('--acc-soft',  'rgba(' + rgb.join(',') + ',0.16)');
    root.setProperty('--acc-soft2', 'rgba(' + rgb.join(',') + ',0.11)');
  }

  function setTheme(i) {
    i = (i + THEMES.length) % THEMES.length;
    el.themeSel.value = i;
    var t = THEMES[i];
    var link = document.getElementById('themeCss');
    link.onload = applyAccent;   // 新主题 css 加载完成后按它重算强调色
    link.href = t.file;
    document.querySelector('.paper-bg').style.background = t.outer;
    document.body.classList.toggle('dark-chrome', t.dark);
    applyAccent();               // 先按（可能还是旧的）值套一次，避免跳色
    updateState();
  }

  function updateState() {
    var d = docs[activeKey];
    el.footName.textContent = d ? d.name : '—';
    var t = THEMES[currentIndex()];
    var chars = writeEl.textContent ? writeEl.textContent.length : 0;
    el.state.textContent = t.name + ' · ' + (d ? d.name : '') + ' · 约 ' + chars + ' 字';
  }

  /* ---------- 事件绑定 ---------- */
  el.sideToggle.addEventListener('click', function () {
    document.body.classList.toggle('side-open');
    try { localStorage.setItem('sideOpen', document.body.classList.contains('side-open') ? '1' : '0'); } catch (e) {}
  });

  THEMES.forEach(function (t, i) {
    var o = document.createElement('option');
    o.value = i; o.textContent = t.name + (t.dark ? ' (暗)' : '');
    el.themeSel.appendChild(o);
  });
  el.themeSel.addEventListener('change', function () { setTheme(parseInt(el.themeSel.value, 10)); });
  el.prevBtn.addEventListener('click', function () { setTheme(currentIndex() - 1); });
  el.nextBtn.addEventListener('click', function () { setTheme(currentIndex() + 1); });

  el.sampleBtn.addEventListener('click', function () { openDoc(builtinSample.key); });

  // 「打开 md 文件」：单个文档加入文件库
  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = '.md,.markdown,text/markdown,text/plain'; fileInput.hidden = true;
  document.body.appendChild(fileInput);
  el.pickBtn.addEventListener('click', function () {
    // 安卓壳里交给原生 SAF 选文件；桌面浏览器回退到本地 input
    if (window.AndroidBridge && window.AndroidBridge.pickFile) { window.AndroidBridge.pickFile(); return; }
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      registerDoc({ key: 'file:' + f.name, name: f.name, path: '本次打开', text: String(r.result || '') });
      buildOpenUpdate('file:' + f.name);
    };
    r.readAsText(f, 'utf-8');
    fileInput.value = '';
  });

  // 「选择文件夹」：webkitdirectory 枚举该目录下所有 .md
  var dirInput = document.createElement('input');
  dirInput.type = 'file'; dirInput.webkitdirectory = true; dirInput.hidden = true;
  document.body.appendChild(dirInput);
  el.folderBtn.addEventListener('click', function () {
    // 安卓壳里交给原生 SAF 选目录；桌面浏览器回退到本地 input
    if (window.AndroidBridge && window.AndroidBridge.pickFolder) { window.AndroidBridge.pickFolder(); return; }
    dirInput.click();
  });
  dirInput.addEventListener('change', function () {
    var mdFiles = Array.prototype.slice.call(dirInput.files).filter(function (f) { return isMd(f.name); });
    if (mdFiles.length === 0) { alert('该文件夹下没有 .md 文件'); return; }
    var pending = mdFiles.length, firstKey = null;
    mdFiles.forEach(function (f) {
      var rel = f.webkitRelativePath || f.name;
      var key = 'lib:' + rel;
      var r = new FileReader();
      r.onload = (function (rel, key) {
        return function () {
          var parts = rel.split('/');
          registerDoc({
            key: key,
            name: parts[parts.length - 1],
            path: parts.slice(0, -1).join('/') || '根目录',
            text: String(r.result || '')
          });
          if (!firstKey) firstKey = key;
          if (--pending === 0) buildOpenUpdate(firstKey);
        };
      })(rel, key);
      r.readAsText(f, 'utf-8');
    });
    dirInput.value = '';
  });

  function buildOpenUpdate(key) {
    registerDoc(builtinSample);   // 确保示例始终在库中（重复注册会被忽略）
    openDoc(key || builtinSample.key);  // openDoc 内部会重建文件列表并高亮
  }

  /* ---------- 原生注入接口（供安卓 WebView 壳调用） ---------- */
  function addExternalBatch(list) {
    if (!list || !list.length) return;
    var firstKey = null;
    list.forEach(function (f) {
      var name = String(f.name || '未命名.md');
      var path = String(f.path || '外部文档');
      var text = String(f.text || '');
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var key = 'ext:' + path + '/' + name;
      registerDoc({ key: key, name: name, path: path, text: text });
      if (!firstKey) firstKey = key;
    });
    renderLib();
    if (firstKey) openDoc(firstKey);
  }
  window.mdReader = { addFiles: function (list) { addExternalBatch(list); } };

  /* ---------- 启动 ---------- */
  registerDoc(builtinSample, true);
  renderLib();
  try {
    if (localStorage.getItem('sideOpen') === '1') document.body.classList.add('side-open');
    setTab(localStorage.getItem('sideTab') || 'files');
  } catch (e) { setTab('files'); }
  setTheme(0);
  openDoc(builtinSample.key);
})();
</script>
</body>
</html>
